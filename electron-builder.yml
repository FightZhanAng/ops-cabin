appId: com.tomcato.ops-cabin
productName: 运维舱
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - node_modules/**
extraResources:
  - from: resources
    to: resources
  # 许可与第三方声明随分发：内嵌的 B612 Mono 为 OFL-1.1，要求随附许可文本
  - from: LICENSE
    to: LICENSE
  - from: THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: 运维舱
  artifactName: ops-cabin-${version}-setup.${ext}
portable:
  artifactName: ops-cabin-${version}-portable.${ext}
publish:
  provider: github
  owner: FightZhanAng
  repo: ops-cabin
